services:
  # ── PostgreSQL 15 ────────────────────────────────────────────
  postgres:
    image: postgres:15-alpine
    container_name: max-shipping-postgres
    restart: unless-stopped
    ports:
      - '${DB_PORT:-5432}:5432'
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-max_shipping}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USERNAME:-postgres}']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - max-shipping-network

  # ── Redis 7 ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: max-shipping-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: >-
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy noeviction
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - max-shipping-network

  # ── NestJS App ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: max-shipping-app
    restart: unless-stopped
    ports:
      - '${PORT:-4001}:${PORT:-4001}'
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Override DB/Redis hosts to point at Docker service names
      DB_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - max-shipping-network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  max-shipping-network:
    driver: bridge
